<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EXHAUST RUN · 배기의 리듬</title><style>
*{box-sizing:border-box}body{margin:0;background:#0e131b;color:#eaf0f2;font-family:system-ui,'Malgun Gothic',sans-serif;min-height:100svh;display:grid;place-items:center}main{width:min(1120px,100%);padding:35px 22px;text-align:center}.eyebrow{color:#eb9d60;font-size:11px;letter-spacing:4px}h1{font-size:clamp(29px,4vw,48px);margin:10px 0;font-weight:650;letter-spacing:-1.5px}.intro{color:#94a2b6;font-size:14px}.screen{position:relative;border:1px solid #ffffff15;border-radius:20px;overflow:hidden;margin-top:30px;background:#1c293a;--pace:1s}svg{display:block;width:100%;height:auto}.road{animation:road var(--pace) linear infinite}.far{animation:far calc(var(--pace)*15) linear infinite}.car{animation:vibrate .13s linear infinite alternate}.wheel{animation:spin calc(var(--pace)*.6) linear infinite;transform-box:fill-box;transform-origin:center}.smoke{animation:smoke calc(var(--pace)*1.7) ease-out infinite;transform-box:fill-box;transform-origin:center;opacity:0}.s2{animation-delay:-.3s}.s3{animation-delay:-.6s}.s4{animation-delay:-.9s}.s5{animation-delay:-1.2s}.flame{animation:fire .09s infinite alternate;transform-origin:320px 354px}.boom{animation:boom .8s infinite;transform-origin:235px 270px}.paused *{animation-play-state:paused!important}.dashboard{display:flex;align-items:center;justify-content:space-between;padding:18px 25px;background:#101820;border-top:1px solid #ffffff10;gap:20px}.speed{font-size:32px;font-variant-numeric:tabular-nums;font-weight:300}.speed small{font-size:11px;color:#8595a7;margin-left:6px}.status{font-size:10px;color:#ecae76;letter-spacing:2px}.controls{display:flex;justify-content:center;flex-wrap:wrap;gap:12px;margin-top:24px}button{min-height:46px;padding:10px 23px;border:1px solid #ffffff25;border-radius:30px;color:#eaf0f2;background:#1c2836;font-size:13px;cursor:pointer}button.primary{background:#e8a363;color:#221b13;border:0}button:focus-visible,input:focus-visible{outline:3px solid #f6bb83;outline-offset:4px}.range{display:flex;align-items:center;justify-content:center;gap:18px;font-size:12px;color:#aab8c6;margin:25px auto 0;max-width:360px}input{width:220px;accent-color:#eda966}.note{font-size:11px;color:#748296;line-height:1.8;margin-top:22px}@keyframes road{to{transform:translateX(-320px)}}@keyframes far{to{transform:translateX(-1000px)}}@keyframes vibrate{to{transform:translateY(2px)}}@keyframes spin{to{transform:rotate(-360deg)}}@keyframes smoke{0%{opacity:.65;transform:translate(0,0) scale(.3)}50%{opacity:.35}100%{opacity:0;transform:translate(-230px,-65px) scale(2.8)}}@keyframes fire{from{opacity:.2;transform:scaleX(.5)}to{opacity:.9;transform:scaleX(1.15)}}@keyframes boom{0%,100%{opacity:.3;transform:scale(.96)}30%{opacity:.9;transform:scale(1.05)}}@media(max-width:600px){main{padding:25px 12px}.screen{margin-top:24px;border-radius:12px}.dashboard{padding:12px 16px}.speed{font-size:25px}.status{font-size:8px;letter-spacing:1px}.intro{font-size:12px}.controls{gap:8px}button{padding:10px 18px}}@media(prefers-reduced-motion:reduce){.screen:not(.explicit-play) *{animation-play-state:paused}}
.real-scene{position:relative;aspect-ratio:16/9;overflow:hidden;background:#17202c}.real-scene>img{width:100%;height:100%;object-fit:cover;animation:camera .16s linear infinite alternate;transform:scale(1.01)}.scene-tag{position:absolute;top:22px;left:24px;font-size:9px;letter-spacing:3px;color:#f4f2ec99}.exhaust-plume{position:absolute;left:27.5%;top:69%;width:1px;height:1px}.exhaust-plume i{display:block;position:absolute;width:65px;height:40px;left:-25px;top:-15px;background:radial-gradient(ellipse,#b7bfca70 0%,#a6b2be35 35%,transparent 70%);filter:blur(5px);border-radius:50%;animation:real-smoke calc(var(--pace)*2.4) linear infinite;animation-delay:var(--delay)}.road-glint{position:absolute;left:0;right:0;bottom:9%;height:2px;opacity:.25;background:repeating-linear-gradient(90deg,transparent 0 100px,#d7dfea 100px 160px,transparent 160px 320px);animation:road var(--pace) linear infinite}.note{max-width:650px;margin-left:auto;margin-right:auto}@keyframes camera{to{transform:scale(1.012) translateY(.7px)}}@keyframes real-smoke{0%{opacity:0;transform:translate(0,0) scale(.4)}12%{opacity:.8}100%{opacity:0;transform:translate(-280px,-45px) scale(3.2)}}@media(max-width:600px){.scene-tag{font-size:7px;top:13px;left:15px}.exhaust-plume i{width:40px;height:28px}@keyframes real-smoke{0%{opacity:0;transform:translate(0,0) scale(.3)}15%{opacity:.8}100%{opacity:0;transform:translate(-140px,-30px) scale(2.6)}}}</style></head><body><main><p class="eyebrow">EXHAUST / MOTION LAB</p><h1>도로를 깨우는 배기의 리듬</h1><p class="intro">회전하는 바퀴, 터져 나오는 굉음, 뒤로 흩어지는 연기.</p><div class="screen"><div class="real-scene" role="img" aria-label="노을빛 도로를 달리는 실사풍 스포츠카와 머플러 연기"><img src="assets/realistic-car.png" alt="금속빛 주황색 스포츠카의 실사풍 주행 장면"><div class="exhaust-plume"><i style="--delay:-0.0s"></i><i style="--delay:-0.23s"></i><i style="--delay:-0.46s"></i><i style="--delay:-0.6900000000000001s"></i><i style="--delay:-0.92s"></i><i style="--delay:-1.1500000000000001s"></i><i style="--delay:-1.3800000000000001s"></i><i style="--delay:-1.61s"></i><i style="--delay:-1.84s"></i><i style="--delay:-2.0700000000000003s"></i></div><div class="road-glint"></div><span class="scene-tag">CINEMATIC EXHAUST STUDY</span></div><div class="dashboard"><div class="speed"><output id="speedValue">90</output><small>km/h · 연출 속도</small></div><span class="status" id="soundStatus">ENGINE SOUND OFF</span></div></div><div class="controls"><button id="sound" class="primary" aria-pressed="false">♪ 소리 켜기</button><button id="pause" aria-pressed="true">Ⅱ 일시정지</button></div><label class="range">주행 속도<input id="speed" type="range" min="30" max="180" value="90" aria-label="주행 연출 속도"></label><p class="note">Harley-Davidson Sportster 시동·공회전·스로틀 녹음 · demodave / Freesound · CC0<br>주행 속도 조절은 영상 연출에만 적용됩니다.<br>AI로 생성한 실사풍 차량 이미지이며 할리데이비슨 오토바이의 모습은 아닙니다.<br><a href="https://freesound.org/people/demodave/sounds/335345/" target="_blank" rel="noopener" style="color:inherit">엔진음 출처 · CC0 ↗</a></p></main><script>
const screen=document.querySelector('.screen'),sound=document.querySelector('#sound'),pause=document.querySelector('#pause'),speed=document.querySelector('#speed'),status=document.querySelector('#soundStatus');
const engine=new Audio('assets/harley-sportster-engine.mp3');engine.loop=true;engine.volume=.35;engine.preload='none';let soundOn=false,playing=!matchMedia('(prefers-reduced-motion: reduce)').matches;
function update(){screen.classList.toggle('paused',!playing);screen.classList.toggle('explicit-play',playing);pause.textContent=playing?'Ⅱ 일시정지':'▶ 재생';pause.setAttribute('aria-pressed',String(playing));screen.style.setProperty('--pace',90/Number(speed.value)+'s');document.querySelector('#speedValue').value=speed.value;sound.textContent=soundOn?'♫ 소리 끄기':'♪ Harley-Davidson Sportster 소리 켜기';sound.setAttribute('aria-pressed',String(soundOn));status.textContent=soundOn&&playing?'Harley-Davidson Sportster · RECORDED AUDIO':'Harley-Davidson Sportster · SOUND OFF';if(!soundOn||!playing||document.hidden)engine.pause();else engine.play().catch(()=>{soundOn=false;sound.textContent='♪ 다시 재생';status.textContent='재생 버튼을 다시 눌러주세요'})}
sound.onclick=()=>{soundOn=!soundOn;update()};pause.onclick=()=>{playing=!playing;update()};speed.oninput=update;document.addEventListener('visibilitychange',update);update();
</script></body></html>
