<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HEARTBEAT · 마음의 리듬</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100svh;background:#100a11;color:#fceaf0;font-family:system-ui,'Malgun Gothic',sans-serif;display:grid;place-items:center;overflow-x:hidden}main{width:min(900px,100%);padding:42px 24px;text-align:center}.eyebrow{font-size:11px;letter-spacing:5px;color:#bc7a91}h1{font-size:clamp(30px,5vw,48px);letter-spacing:-1.5px;margin:16px 0 10px;font-weight:600}.subtitle{color:#b89ba8;font-size:14px}.stage{height:360px;position:relative;display:grid;place-items:center;isolation:isolate;--cycle:.833333s}.stage:before{content:'';position:absolute;width:300px;height:300px;border-radius:50%;background:#a5154220;filter:blur(40px)}.heart{width:180px;height:180px;position:relative;transform:rotate(-45deg);border-radius:12px;background:linear-gradient(135deg,#ff85aa,#f52564 65%,#b00b3d);animation:beat var(--cycle) infinite;filter:drop-shadow(0 0 28px #ff2b644a);z-index:2}.heart:before,.heart:after{content:'';position:absolute;width:180px;height:180px;border-radius:50%;background:inherit}.heart:before{top:-90px;left:0;background:linear-gradient(135deg,#ff96b6,#ff5388)}.heart:after{left:90px;top:0;background:linear-gradient(135deg,#ff6797,#e71b56)}.heart-wrap{transform:translateY(25px) scale(.72)}.ring{position:absolute;width:230px;height:230px;border:1px solid #f24b7a55;border-radius:50%;animation:ripple var(--cycle) infinite;z-index:-1}.ring.second{animation-delay:calc(var(--cycle)*.27)}@keyframes beat{0%,38%,100%{transform:rotate(-45deg) scale(1)}12%{transform:rotate(-45deg) scale(1.17)}20%{transform:rotate(-45deg) scale(1.02)}29%{transform:rotate(-45deg) scale(1.1)}}@keyframes ripple{0%{transform:scale(.7);opacity:0}15%{opacity:.7}100%{transform:scale(1.65);opacity:0}}.paused *{animation-play-state:paused!important}.readout{display:flex;align-items:baseline;gap:10px;justify-content:center;margin-top:-5px}.readout output{font-size:50px;font-weight:300;font-variant-numeric:tabular-nums;letter-spacing:-2px}.readout span{font-size:11px;letter-spacing:3px;color:#c58b9f}.controls{margin:24px auto 0;max-width:350px;padding-top:24px;border-top:1px solid #ffffff15}.slider-label{display:flex;justify-content:space-between;color:#bd9aa9;font-size:12px;margin-bottom:15px}input{width:100%;accent-color:#ff4a82;cursor:pointer;height:28px}button{margin-top:20px;min-width:145px;min-height:48px;background:#fae7ee;border:0;border-radius:30px;color:#481329;font-size:14px;font-weight:600;cursor:pointer}button:hover{background:#ffc6da}button:focus-visible,input:focus-visible{outline:3px solid #ff7da7;outline-offset:5px}.note{font-size:11px;color:#826575;margin-top:30px}.motion-note{font-size:12px;color:#cf9bac;display:none}@media(max-width:500px){main{padding-top:32px}.stage{height:320px}.heart-wrap{transform:translateY(25px) scale(.62)}.ring{width:200px;height:200px}.subtitle{font-size:13px}}@media(prefers-reduced-motion:reduce){.stage *{animation-play-state:paused}.motion-note{display:block}.stage.user-playing *{animation-play-state:running}.stage.paused *{animation-play-state:paused}}
</style></head><body><main><p class="eyebrow">HEARTBEAT / MOTION STUDY</p><h1>마음이 뛰는 순간</h1><p class="subtitle">두 번의 작은 울림, 하나의 리듬.</p><div class="stage" role="img" aria-label="심장 박동처럼 두 번씩 뛰는 분홍빛 하트"><div class="ring"></div><div class="ring second"></div><div class="heart-wrap"><div class="heart"></div></div></div><div class="readout"><output id="value" for="speed">72</output><span>BPM</span></div><div class="controls"><label class="slider-label" for="speed"><span>박동 속도</span><span>40 — 140 BPM</span></label><input id="speed" type="range" min="40" max="140" value="72" aria-label="분당 박동 수"><br><button id="toggle" type="button" aria-pressed="true">Ⅱ 일시정지</button></div><p class="motion-note">동작 줄이기 설정에 따라 멈춰 있습니다. 재생 버튼으로 시작할 수 있어요.</p><p class="note">시각적 모션 그래픽 · 소리 없이 재생됩니다</p></main><script>
const stage=document.querySelector('.stage'),speed=document.querySelector('#speed'),value=document.querySelector('#value'),toggle=document.querySelector('#toggle');let playing=!matchMedia('(prefers-reduced-motion: reduce)').matches;function sync(){stage.classList.toggle('paused',!playing);stage.classList.toggle('user-playing',playing);toggle.textContent=playing?'Ⅱ 일시정지':'▶ 재생';toggle.setAttribute('aria-pressed',String(playing))}speed.addEventListener('input',()=>{value.value=speed.value;stage.style.setProperty('--cycle',60/Number(speed.value)+'s')});toggle.addEventListener('click',()=>{playing=!playing;sync()});sync();
</script></body></html>
